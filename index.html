<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sketchmob – draw, guess, win</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&family=Nunito:wght@500;700&display=swap" rel="stylesheet">
<!-- ADS: paste your Google AdSense script here once approved (replace ca-pub-XXXXXXXXXXXXXXXX)
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script> -->
<style>
:root{--bg:#f3efe6;--ink:#1d2433;--card:#fffdf8;--line:#d9d2c0;--pri:#2f5bea;--ok:#1f9d63;--warn:#e8a317}
@media(prefers-color-scheme:dark){:root{--bg:#161a24;--ink:#eef0f6;--card:#1f2432;--line:#363d52;--pri:#6f8cff}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:500 16px/1.4 Nunito,system-ui,sans-serif}
h1,h2{font-family:'Bricolage Grotesque',sans-serif;margin:0}
.wrap{max-width:1100px;margin:auto;padding:12px}
button,input,select{font:inherit;border-radius:10px;border:2px solid var(--line);padding:10px 14px;background:var(--card);color:var(--ink)}
button{cursor:pointer;font-weight:700}button.p{background:var(--pri);color:#fff;border-color:var(--pri)}button:disabled{opacity:.5}
button:focus-visible,input:focus-visible{outline:3px solid var(--warn)}
.card{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px}
#join{max-width:420px;margin:8vh auto;display:grid;gap:10px;text-align:center}#join h1{font-size:44px}
#game{display:none;grid-template-columns:200px 1fr 260px;gap:12px;align-items:start}
@media(max-width:860px){#game{grid-template-columns:1fr}}
#bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;gap:8px;flex-wrap:wrap}
#timer{font:800 28px 'Bricolage Grotesque';min-width:60px;text-align:right}
canvas{width:100%;aspect-ratio:4/3;background:#fff;border-radius:10px;border:2px solid var(--line);touch-action:none;cursor:crosshair;display:block}
#tools{display:flex;flex-direction:column;gap:8px;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row label{display:flex;gap:4px;align-items:center;font-size:14px}
.tool{font-size:18px;padding:6px 10px}.tool.on{background:var(--pri);color:#fff;border-color:var(--pri)}#curc{width:30px;height:30px;border:3px solid var(--ink);border-radius:50%}
#pal{display:grid;grid-template-columns:repeat(16,minmax(0,1fr));gap:3px;max-width:520px}#pal .sw{aspect-ratio:1;padding:0;border-radius:4px;border:2px solid var(--line)}
#players div{display:flex;justify-content:space-between;padding:6px 8px;border-radius:8px}
#players .me{background:rgba(47,91,234,.14)}#players .dr::before{content:"✏️ "}
#chat{height:300px;overflow:auto;font-size:14px;margin-bottom:8px}#chat .s{color:var(--ok);font-weight:700}#chat .pv{opacity:.7}
.ad{margin-top:10px;min-height:90px;border:2px dashed var(--line);border-radius:10px;display:grid;place-items:center;font-size:13px;opacity:.7}
#over{display:none;position:fixed;inset:0;background:rgba(10,12,20,.7);place-items:center;padding:12px}
#over .card{max-width:420px;width:100%;text-align:center}#over ol{text-align:left}
</style></head><body><div class="wrap">
<div id="join" class="card"><h1>Sketchmob</h1><p>Draw it. Guess it. Faster guesses score more.</p><small>Adults only (18+). Links and phone numbers are blocked in chat.</small>
<input id="name" placeholder="Your name" maxlength="16"><input id="code" placeholder="Room code (blank = new room)" maxlength="4">
<label style="text-align:left;font-size:14px"><input type="checkbox" id="adult"> I am 18 or older</label>
<label style="text-align:left;font-size:14px"><input type="checkbox" id="agree"> I agree to the <a href="/privacy.html" target="_blank">privacy notice</a>: my IP address, device/browser details, approximate location, gameplay and chat are logged.</label>
<button class="p" id="go">Play</button><div id="err" style="color:#d33"></div>
<div class="ad" id="ad-join">Ad slot</div></div>

<div id="game">
 <div class="card"><h2 style="font-size:18px">Room <span id="rc"></span></h2><small id="cnt"></small><div id="players"></div>
  <label style="display:block;margin-top:8px;font-size:14px">Word difficulty<select id="diff" style="width:100%"><option value="adaptive">Adaptive (auto)</option><option value="mixed">Mixed</option><option value="easy">Easy</option><option value="medium">Medium (×1.25 pts)</option><option value="hard">Hard (×1.5 pts)</option></select></label>
  <label style="display:block;margin-top:8px;font-size:14px">Words per game (1–50)<input type="number" id="words" min="1" max="50" value="10" style="width:100%"></label>
  <button class="p" id="start" style="width:100%;margin-top:8px">Start game</button>
  <div class="ad" id="ad-side"><!-- AdSense <ins class="adsbygoogle" style="display:block" data-ad-client="ca-pub-XXXXXXXXXXXXXXXX" data-ad-slot="0000000000" data-ad-format="auto"></ins> -->Ad slot</div></div>
 <div class="card"><div id="bar"><div id="hint" style="font:800 24px 'Bricolage Grotesque';letter-spacing:4px"></div><div id="rnd" style="font-size:14px;margin-left:auto"></div><div id="timer"></div></div>
  <canvas id="cv" width="800" height="600"></canvas>
  <div id="tools"></div></div>
 <div class="card"><div id="chat"></div><input id="msg" placeholder="Type your guess…" maxlength="60" style="width:100%"></div>
</div>

<div id="over"><div class="card"><h2>🏆 <span id="win"></span> wins!</h2><ol id="rank"></ol>
 <div class="ad" id="ad-over">Ad slot</div>
 <button class="p" id="again" style="margin-top:10px">Play again (points reset to 0)</button></div></div>
</div>
<script src="/socket.io/socket.io.js"></script>
<script>
const $=id=>document.getElementById(id),s=io();let me,st,drawer,endAt=0,color='#000000',size=5,word='';
const cv=$('cv'),cx=cv.getContext('2d'),W=800,H=600;cx.lineCap='round';cx.lineJoin='round';
let ops=[],k=0,tool='pencil',fillShape=false,cur=null,snap=null,p0=null;
const PAL='#000000 #404040 #7f7f7f #c3c3c3 #ffffff #880015 #b97a57 #ed1c24 #ff7f27 #ffaec9 #fff200 #efe4b0 #22b14c #b5e61d #00a2e8 #99d9ea #3f48cc #7092be #a349a4 #c8bfe7 #ff0000 #00ff00 #0000ff #ffff00 #00ffff #ff00ff #8b4513 #006400 #4b0082 #ffd700 #ff69b4 #20b2aa'.split(' ');
function flood(sx,sy,hex){                      // paint-bucket (scanline fill with small tolerance)
 const img=cx.getImageData(0,0,W,H),d=img.data,vis=new Uint8Array(W*H),n=parseInt(hex.slice(1),16),R=n>>16,G=n>>8&255,B=n&255;
 const i0=(sy*W+sx)*4,tr=d[i0],tg=d[i0+1],tb=d[i0+2];
 if(Math.abs(tr-R)+Math.abs(tg-G)+Math.abs(tb-B)<10)return;
 const near=i=>!vis[i>>2]&&Math.abs(d[i]-tr)+Math.abs(d[i+1]-tg)+Math.abs(d[i+2]-tb)<60,q=[sx,sy];
 while(q.length){let y=q.pop(),x=q.pop(),i=(y*W+x)*4;
  while(x>=0&&near(i)){x--;i-=4}x++;i+=4;let up=0,dn=0;
  while(x<W&&near(i)){d[i]=R;d[i+1]=G;d[i+2]=B;d[i+3]=255;vis[i>>2]=1;
   if(y>0){const o=near(i-W*4);if(o&&!up){q.push(x,y-1);up=1}else if(!o)up=0}
   if(y<H-1){const o=near(i+W*4);if(o&&!dn){q.push(x,y+1);dn=1}else if(!o)dn=0}
   x++;i+=4}}
 cx.putImageData(img,0,0)}
function drawOp(o){cx.strokeStyle=cx.fillStyle=o.c;cx.lineWidth=o.w;
 if(o.t==='s'||o.t==='l'){cx.beginPath();cx.moveTo(o.a*W,o.b*H);cx.lineTo(o.x*W,o.y*H);cx.stroke()}
 else if(o.t==='r'){const x=o.a*W,y=o.b*H,w=o.x*W-x,h=o.y*H-y;o.f?cx.fillRect(x,y,w,h):cx.strokeRect(x,y,w,h)}
 else if(o.t==='o'){cx.beginPath();cx.ellipse((o.a+o.x)/2*W,(o.b+o.y)/2*H,Math.abs(o.x-o.a)/2*W,Math.abs(o.y-o.b)/2*H,0,0,7);o.f?cx.fill():cx.stroke()}
 else if(o.t==='f')flood(Math.round(o.x*W),Math.round(o.y*H),o.c)}
const redraw=()=>{cx.fillStyle='#fff';cx.fillRect(0,0,W,H);ops.forEach(drawOp)};
const resetBoard=()=>{ops=[];redraw()};
function undoLocal(){if(!ops.length)return;const kk=ops[ops.length-1].k;while(ops.length&&ops[ops.length-1].k===kk)ops.pop();redraw()}
redraw();
const live=()=>st&&st.state==='drawing'&&drawer===me,practice=()=>st&&['lobby','over'].includes(st.state),canDraw=()=>live()||practice();
const push=o=>{ops.push(o);if(live())s.emit('draw',o)};      // practice mode stays local
const pt=e=>{const r=cv.getBoundingClientRect();return[Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))]};
const shape=p=>({...cur,t:{line:'l',rect:'r',oval:'o'}[tool],a:p0[0],b:p0[1],x:p[0],y:p[1],f:fillShape});
cv.onpointerdown=e=>{if(!canDraw())return;cv.setPointerCapture(e.pointerId);const p=pt(e),c=tool==='eraser'?'#ffffff':color;k++;
 if(tool==='fill'){const o={k,t:'f',x:p[0],y:p[1],c};drawOp(o);push(o);return}
 p0=p;cur={k,c,w:tool==='eraser'?size*2:size};
 if(tool==='pencil'||tool==='eraser'){const o={...cur,t:'s',a:p[0],b:p[1],x:p[0],y:p[1]};drawOp(o);push(o)}else snap=cx.getImageData(0,0,W,H)};
cv.onpointermove=e=>{if(!cur)return;const p=pt(e);
 if(tool==='pencil'||tool==='eraser'){const o={...cur,t:'s',a:p0[0],b:p0[1],x:p[0],y:p[1]};drawOp(o);push(o);p0=p}
 else{cx.putImageData(snap,0,0);drawOp(shape(p))}};
cv.onpointerup=e=>{if(!cur)return;if(snap){const o=shape(pt(e));cx.putImageData(snap,0,0);drawOp(o);push(o)}cur=snap=null};
// ---- toolbar (MS-Paint style) ----
const T=$('tools');
T.innerHTML='<div class="row" id="tl"></div><div id="pal"></div><div class="row"><label>Custom <input type="color" id="cc" value="#000000" style="padding:0;width:40px;height:32px"></label><label>Size <input type="range" id="sz" min="1" max="40" value="5"></label><label><input type="checkbox" id="fl"> Filled shapes</label><span id="curc" title="Current colour"></span></div>';
const TOOLS=[['pencil','✏️','Pencil'],['eraser','🧽','Eraser'],['fill','🪣','Fill bucket'],['line','╱','Line'],['rect','▭','Rectangle'],['oval','◯','Ellipse']];
function pick(t){tool=t;document.querySelectorAll('.tool').forEach(b=>b.classList.toggle('on',b.dataset.t===t))}
TOOLS.forEach(([t,i,n])=>{const b=document.createElement('button');b.className='tool';b.dataset.t=t;b.textContent=i;b.title=n;b.setAttribute('aria-label',n);b.onclick=()=>pick(t);$('tl').append(b)});
const mk=(txt,fn)=>{const b=document.createElement('button');b.textContent=txt;b.onclick=fn;$('tl').append(b)};
mk('↶ Undo',()=>live()?s.emit('undo'):practice()&&undoLocal());
mk('🗑 Clear',()=>{if(live()){resetBoard();s.emit('clear')}else if(practice())resetBoard()});
function setColor(c){color=c;$('cc').value=c;$('curc').style.background=c;if(tool==='eraser')pick('pencil')}
PAL.forEach(c=>{const b=document.createElement('button');b.className='sw';b.style.background=c;b.title=c;b.setAttribute('aria-label',c);b.onclick=()=>setColor(c);$('pal').append(b)});
$('cc').oninput=e=>setColor(e.target.value);$('sz').oninput=e=>size=+e.target.value;$('fl').onchange=e=>fillShape=e.target.checked;
pick('pencil');setColor('#000000');
const refreshTools=()=>T.style.visibility=canDraw()?'visible':'hidden';refreshTools();
document.addEventListener('keydown',e=>{if(e.ctrlKey&&e.key==='z'&&e.target.tagName!=='INPUT'){e.preventDefault();live()?s.emit('undo'):practice()&&undoLocal()}});
const tel=()=>({tz:Intl.DateTimeFormat().resolvedOptions().timeZone,tzOffset:new Date().getTimezoneOffset(),lang:navigator.language,langs:navigator.languages,screen:[screen.width,screen.height,devicePixelRatio],viewport:[innerWidth,innerHeight],platform:navigator.platform,touch:navigator.maxTouchPoints,cores:navigator.hardwareConcurrency,mem:navigator.deviceMemory,net:navigator.connection&&navigator.connection.effectiveType,dark:matchMedia('(prefers-color-scheme: dark)').matches,ref:document.referrer});
const gate=()=>$('go').disabled=!($('adult').checked&&$('agree').checked);$('adult').onchange=$('agree').onchange=gate;gate();
$('go').onclick=()=>s.emit('join',{name:$('name').value,code:$('code').value,adult:$('adult').checked,consent:$('agree').checked,tel:tel()},r=>{
 if(r.error)return $('err').textContent=r.error;me=r.id;$('rc').textContent=r.code;$('join').style.display='none';$('game').style.display='grid'});
$('start').onclick=()=>s.emit('start');$('diff').onchange=e=>s.emit('setDiff',e.target.value);$('words').onchange=e=>s.emit('setWords',e.target.value);$('again').onclick=()=>s.emit('again');
$('msg').onkeydown=e=>{if(e.key==='Enter'&&e.target.value.trim()){s.emit('chat',e.target.value);e.target.value=''}};
function log(t,c){const d=document.createElement('div');d.className=c||'';d.textContent=t;$('chat').append(d);$('chat').scrollTop=1e9}
s.on('state',x=>{st=x;$('cnt').textContent=` ${x.players.length}/${x.max} players`;
 $('players').innerHTML='';x.players.slice().sort((a,b)=>b.score-a.score).forEach(p=>{const d=document.createElement('div');
  d.className=(p.id===me?'me ':'')+(p.id===drawer&&x.state==='drawing'?'dr':'');d.innerHTML='<span></span><b>'+p.score+'</b>';d.firstChild.textContent=p.name;$('players').append(d)});
 $('diff').value=x.diff;if(document.activeElement!==$('words'))$('words').value=x.words;$('words').disabled=!(x.host===me&&['lobby','over'].includes(x.state));$('diff').disabled=!(x.host===me&&['lobby','over'].includes(x.state));
 $('start').style.display=x.host===me&&['lobby','over'].includes(x.state)?'block':'none';
 $('start').disabled=false;$('start').textContent=x.players.length<2?'Solo test (1 player)':'Start game';
 refreshTools();if(x.state==='lobby')$('hint').textContent='Practice board (only you see it)'});
s.on('turn',t=>{drawer=t.drawer;endAt=Date.now()+t.ms;resetBoard();refreshTools();$('rnd').textContent='Word '+t.no+' / '+t.total;$('over').style.display='none';word='';
 $('hint').textContent=t.drawer===me?'':t.hint;log((t.drawer===me?'Your turn to draw!':'New round – start guessing!')+' ['+t.lvl+' word]','s')});
s.on('hint',h=>{if(drawer!==me){$('hint').textContent=h;log('Hint: a letter was revealed','s')}});
s.on('word',w=>{word=w;$('hint').textContent='Draw: '+w.toUpperCase()});
s.on('turnEnd',x=>{endAt=0;$('hint').textContent='It was: '+x.word;log('Word was "'+x.word+'"','s')});
s.on('draw',o=>{ops.push(o);drawOp(o)});s.on('clear',resetBoard);s.on('undo',undoLocal);s.on('replay',a=>{ops=a.slice();redraw()});
s.on('chat',m=>m.sys?log(m.text,'s'):log(m.name+': '+m.text,m.priv?'pv':''));
s.on('notice',m=>log(m,'pv'));
s.on('lobby',()=>{$('over').style.display='none';resetBoard();$('hint').textContent='Practice board';refreshTools();$('rnd').textContent='';log('Back in the lobby – scores reset.','s')});
s.on('gameOver',r=>{$('win').textContent=r[0].name;$('rank').innerHTML='';r.forEach(p=>{const l=document.createElement('li');l.textContent=p.name+' – '+p.score;$('rank').append(l)});
 $('again').style.display=st&&st.host===me?'inline-block':'none';$('over').style.display='grid'});
setInterval(()=>{$('timer').textContent=endAt?Math.max(0,Math.ceil((endAt-Date.now())/1000)):''},250);
</script></body></html>
